<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Houses - Lichess Puzzle Bot</title>
<link rel="stylesheet" href="/static/admin.css">
<style>
  /* ---- houses: a quiet strip, since they rarely change ---- */
  .houses { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; align-items: center; }
  .chip-add {
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 0.88rem;
    font-weight: 500;
  }
  .chip-add:hover { color: var(--fg); border-color: var(--muted); }
  .add-house { display: flex; gap: 6px; }
  .add-house input { width: 170px; padding: 5px 10px; font-size: 0.88rem; border-radius: 999px; }
  .add-house button { padding: 5px 12px; font-size: 0.85rem; border-radius: 999px; }
  .add-house .cancel { background: transparent; color: var(--muted); font-weight: 500; }

  /* ---- players ---- */
  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .toolbar input { flex: 1; }
  .toolbar select { width: 170px; }
  .summary { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
  .summary strong { color: var(--warn); font-weight: 600; }

  /* One grid for every row, so names, houses and actions line up in columns. */
  .player {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 180px 28px;
    align-items: center;
    gap: 12px;
    padding: 9px 10px 9px 16px;
    border-bottom: 1px solid var(--border);
    min-height: 50px;
  }
  .player:last-child { border-bottom: none; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .house-name { padding: 0 11px; color: var(--accent-strong); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player select { width: 100%; }
  .player.unassigned select { border-color: var(--warn); color: var(--warn); }
  .remove {
    width: 28px;
    height: 28px;
    padding: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-size: 1.1rem;
    line-height: 1;
    font-weight: 400;
    opacity: 0;
  }
  .player:hover .remove, .remove:focus-visible { opacity: 1; }
  .remove:hover { background: var(--surface-2); color: var(--danger); }
  @media (hover: none) { .remove { opacity: 0.6; } }

  @media (max-width: 480px) {
    .player { grid-template-columns: minmax(0, 1fr) 140px 28px; gap: 8px; padding-left: 12px; }
    .add-house input { width: 130px; }
    .toolbar { flex-wrap: wrap; }
    .toolbar input { flex-basis: 100%; }
    .toolbar select { flex: 1; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><span class="brand-icon" aria-hidden="true"></span><span class="brand-text">Lichess Puzzle Bot</span></a>
    <nav aria-label="Pages"><a href="/leaderboard">Leaderboard</a><a href="/houses" aria-current="page">Houses</a></nav>
  </div>
</header>
<main>
  <h1>Houses</h1>

  <p class="loading" id="loading" hidden>Loading…</p>

  <section id="unlockSection" hidden>
    <form class="card unlock" id="unlockForm">
      <p>Enter the admin secret to continue. It's kept only for this browser tab.</p>
      <div class="row">
        <input type="password" id="secret" placeholder="Admin secret" autocomplete="current-password" required>
        <button class="btn-primary" type="submit">Unlock</button>
      </div>
    </form>
  </section>

  <div id="app" hidden>
    <div class="houses" id="houses"></div>

    <div class="toolbar">
      <input type="search" id="filter" placeholder="Search players">
      <select id="houseFilter" aria-label="Filter by house"></select>
      <span class="summary" id="summary"></span>
    </div>
    <div class="card" id="playerList"></div>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/static/admin.js"></script>
<script>
  (function () {
    // houseFilter: '' = all houses, 'none' = unassigned, otherwise a house id.
    var state = { houses: [], players: [], adding: false, houseFilter: '' };

    var api = Admin.api, el = Admin.el, toast = Admin.toast;

    function load() {
      return Promise.all([api('GET', '/admin/houses'), api('GET', '/admin/players')]).then(function (results) {
        state.houses = results[0];
        state.players = results[1];
        Admin.showApp();
        render();
      });
    }

    function houseById(id) {
      return state.houses.find(function (h) { return h.id === id; });
    }

    function displayName(player) {
      return player.userName || player.userId;
    }

    function renderHouses() {
      var strip = document.getElementById('houses');
      strip.textContent = '';
      var counts = {};
      state.players.forEach(function (p) {
        if (p.houseId !== null) counts[p.houseId] = (counts[p.houseId] || 0) + 1;
      });

      state.houses.forEach(function (house) {
        var chip = el('button', 'chip', house.name);
        chip.type = 'button';
        chip.title = 'Show only ' + house.name;
        chip.setAttribute('aria-pressed', String(state.houseFilter === String(house.id)));
        chip.appendChild(el('span', 'n', String(counts[house.id] || 0)));
        chip.addEventListener('click', function () {
          setHouseFilter(state.houseFilter === String(house.id) ? '' : String(house.id));
        });
        strip.appendChild(chip);
      });

      if (state.adding || !state.houses.length) {
        strip.appendChild(addHouseForm());
      } else {
        var add = el('button', 'chip-add', '+ House');
        add.type = 'button';
        add.addEventListener('click', function () { state.adding = true; renderHouses(); });
        strip.appendChild(add);
      }
    }

    function addHouseForm() {
      var form = el('form', 'add-house');
      var input = el('input');
      input.type = 'text';
      input.placeholder = 'House name';
      input.maxLength = 60;
      input.required = true;
      input.setAttribute('aria-label', 'New house name');
      var save = el('button', 'btn-primary', 'Add');
      save.type = 'submit';
      form.appendChild(input);
      form.appendChild(save);
      if (state.houses.length) {
        var cancel = el('button', 'cancel', 'Cancel');
        cancel.type = 'button';
        cancel.addEventListener('click', function () { state.adding = false; renderHouses(); });
        form.appendChild(cancel);
      }
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = input.value.trim();
        if (!name) return;
        save.disabled = true;
        api('POST', '/admin/houses', { name: name }).then(function () {
          state.adding = false;
          toast('Added ' + name);
          return load();
        }).catch(function (err) {
          save.disabled = false;
          toast(err.message, true);
        });
      });
      setTimeout(function () { input.focus(); }, 0);
      return form;
    }

    function renderHouseFilter() {
      var select = document.getElementById('houseFilter');
      select.textContent = '';
      [['', 'All houses'], ['none', 'Unassigned']].concat(state.houses.map(function (h) {
        return [String(h.id), h.name];
      })).forEach(function (pair) {
        var opt = el('option', null, pair[1]);
        opt.value = pair[0];
        select.appendChild(opt);
      });
      // A house filter can outlive its house only in theory (houses aren't deleted), but don't strand the view.
      if (state.houseFilter && state.houseFilter !== 'none' && !houseById(parseInt(state.houseFilter, 10))) state.houseFilter = '';
      select.value = state.houseFilter;
    }

    function setHouseFilter(value) {
      state.houseFilter = value;
      render();
    }

    function matchesHouse(player) {
      if (state.houseFilter === '') return true;
      if (state.houseFilter === 'none') return player.houseId === null;
      return String(player.houseId) === state.houseFilter;
    }

    function renderPlayers() {
      var container = document.getElementById('playerList');
      container.textContent = '';
      var query = document.getElementById('filter').value.trim().toLowerCase();
      var unassigned = state.players.filter(function (p) { return p.houseId === null; }).length;

      var shown = state.players.filter(function (p) {
        return matchesHouse(p) && (!query || displayName(p).toLowerCase().indexOf(query) !== -1);
      });

      var summary = document.getElementById('summary');
      var total = state.players.length;
      summary.textContent = (shown.length === total ? total : shown.length + ' of ' + total) + ' players';
      if (unassigned) {
        summary.appendChild(document.createTextNode(' · '));
        summary.appendChild(el('strong', null, unassigned + ' unassigned'));
      }
      if (!shown.length) {
        container.appendChild(el('p', 'empty', state.players.length ? 'No players match.' : 'No players yet - they appear here after their first answer.'));
        return;
      }

      shown.forEach(function (player) {
        var row = el('div', 'player' + (player.houseId === null ? ' unassigned' : ''));
        row.appendChild(el('div', 'name', displayName(player)));

        if (player.houseId !== null) {
          var house = houseById(player.houseId);
          row.appendChild(el('div', 'house-name', house ? house.name : '?'));
          var remove = el('button', 'remove', '×');
          remove.type = 'button';
          remove.title = 'Remove from house';
          remove.setAttribute('aria-label', 'Remove ' + displayName(player) + ' from ' + (house ? house.name : 'house'));
          remove.addEventListener('click', function () { unassign(player, house, remove); });
          row.appendChild(remove);
        } else {
          var select = el('select');
          select.setAttribute('aria-label', 'House for ' + displayName(player));
          var none = el('option', null, 'Assign…');
          none.value = '';
          select.appendChild(none);
          state.houses.forEach(function (house) {
            var opt = el('option', null, house.name);
            opt.value = String(house.id);
            select.appendChild(opt);
          });
          select.addEventListener('change', function () { assign(player, select); });
          row.appendChild(select);
          row.appendChild(el('span'));
        }

        container.appendChild(row);
      });
    }

    function assign(player, select) {
      var house = houseById(parseInt(select.value, 10));
      if (!house || !confirm('Put ' + displayName(player) + ' in ' + house.name + '?')) {
        select.value = '';
        return;
      }
      select.disabled = true;
      api('PUT', '/admin/players/' + encodeURIComponent(player.userId) + '/house', { houseId: house.id }).then(function () {
        player.houseId = house.id;
        toast(displayName(player) + ' → ' + house.name);
        render();
      }).catch(function (err) {
        toast(err.message, true);
        // Most likely assigned from somewhere else in the meantime - show the real state.
        load().catch(function () {});
      });
    }

    function unassign(player, house, button) {
      if (!confirm('Remove ' + displayName(player) + ' from ' + (house ? house.name : 'their house') + '?')) return;
      button.disabled = true;
      api('DELETE', '/admin/players/' + encodeURIComponent(player.userId) + '/house').then(function () {
        toast(displayName(player) + ' removed from ' + (house ? house.name : 'their house'));
        return load();
      }).catch(function (err) {
        toast(err.message, true);
        load().catch(function () {});
      });
    }

    function render() {
      renderHouseFilter();
      renderHouses();
      renderPlayers();
    }

    document.getElementById('filter').addEventListener('input', renderPlayers);
    document.getElementById('houseFilter').addEventListener('change', function (e) { setHouseFilter(e.target.value); });

    Admin.start(load);
  })();
</script>
</body>
</html>
