name: Cron - send leaderboard

on:
  schedule:
    - cron: "0 11 * * *" # 4:30 PM IST
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger send-leaderboard
        run: |
          curl -sf "https://lichess-puzzle-slack-bot.vercel.app/cron/send-leaderboard" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
