name: Cron

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Which cron to trigger"
        required: true
        type: choice
        options:
          - send-puzzle
          - send-leaderboard

env:
  BASE_URL: https://lichess-puzzle-slack-bot.vercel.app

jobs:
  send-puzzle:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'send-puzzle' || github.event.schedule == '30 11 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger send-puzzle
        run: |
          curl -sf "$BASE_URL/cron/send-puzzle" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  send-leaderboard:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'send-leaderboard' || github.event.schedule == '0 11 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger send-leaderboard
        run: |
          curl -sf "$BASE_URL/cron/send-leaderboard" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
